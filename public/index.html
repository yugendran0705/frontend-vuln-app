<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bookshelf - Login</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="wrap">
  <h1>📚 Bookshelf</h1>

  <div class="card">
    <h2>Login</h2>
    <p id="error" class="error"></p>
    <input id="username" placeholder="Username" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="loginBtn">Login</button>
  </div>

  <div class="card">
    <h2>Register</h2>
    <p id="regError" class="error"></p>
    <input id="regUsername" placeholder="Username" />
    <input id="regName" placeholder="Full name (optional)" />
    <input id="regPassword" type="password" placeholder="Password" />
    <button id="registerBtn" class="secondary">Create account</button>
    <p class="small">New accounts are always created with role "user".</p>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
