<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bookshelf - My Books</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>📚 My Books</h1>
    <div>
      <span id="whoami" class="small"></span>
      <button class="secondary" onclick="logout()">Logout</button>
    </div>
  </div>

  <div id="adminHint" class="warn-box" style="display:none">
    Your account role is <strong>admin</strong>. <a href="/admin.html">Go to the Admin Panel &rarr;</a>
  </div>

  <div class="card">
    <h2>Add a book</h2>
    <p id="error" class="error"></p>
    <input id="title" placeholder="Title" />
    <input id="author" placeholder="Author" />
    <input id="year" placeholder="Year" />
    <button id="addBtn">Add book</button>
  </div>

  <div class="card">
    <h2>Your books</h2>
    <div id="books"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
